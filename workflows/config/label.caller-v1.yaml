# Reproduce caller-v1 golden exactly (byte-identical merged.tab + dataset.tsv
# vs export/v2fix11/). Writes to fresh dirs so existing results_v2fix11 is untouched.
# Usage:
#   snakemake -s workflows/label.smk --configfile workflows/config/label.caller-v1.yaml -j 1
#   python scripts/check_golden.py --results /data/results_caller_v1 --labels /data/labels_caller_v1
data_root: /data
results_dir: results_caller_v1
labels_dir: labels_caller_v1
reference: /data/ref/GRCh38_full_analysis_set_plus_decoy_hla.fa
gaps: /data/ref/gaps.bed
unreliable: /data/ref/unreliable.bed
# Keep empty for published min-size-only numbers; paper BEDs via fetch_filter_beds.py.
simple_repeats: ""
segdups: ""
blacklist: ""
chroms:
  - chr20
samples:
  - HG01884
  - NA19700
cram:
  HG01884: https://1000genomes.s3.amazonaws.com/1000G_2504_high_coverage/additional_698_related/data/ERR3988940/HG01884.final.cram
  NA19700: https://1000genomes.s3.amazonaws.com/1000G_2504_high_coverage/data/ERR3239913/NA19700.final.cram
sequential: true
threads: 1
