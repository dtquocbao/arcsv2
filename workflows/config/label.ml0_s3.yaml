# ML-0 S3 pilot: 3 samples, whole genome (chr1-22 + chrX). Image arcsv2:ml0.
# Pilots: HG01884 AFR, HG01150 AMR, HG00126 EUR. Local CRAMs after fetch --fetch-cram.
data_root: /data
results_dir: results_ml0_s3
labels_dir: labels_ml0_s3
reference: /data/ref/GRCh38_full_analysis_set_plus_decoy_hla.fa
gaps: /data/ref/gaps.bed
unreliable: /data/ref/unreliable.bed
simple_repeats: /data/ref/simple_repeats.bed
segdups: /data/ref/segdups.bed
# 10x cf.10xgenomics.com/.../svblacklist.bed returns HTTP 403 as of 2026-10-05.
# Omit rather than substitute a different blacklist; simple_repeats+segdups+gaps still on.
blacklist: ""
chroms:
  - chr1
  - chr2
  - chr3
  - chr4
  - chr5
  - chr6
  - chr7
  - chr8
  - chr9
  - chr10
  - chr11
  - chr12
  - chr13
  - chr14
  - chr15
  - chr16
  - chr17
  - chr18
  - chr19
  - chr20
  - chr21
  - chr22
  - chrX
samples:
  - HG01884
  - HG01150
  - HG00126
cram:
  HG01884: /data/samples/HG01884/reads/HG01884.cram
  HG01150: /data/samples/HG01150/reads/HG01150.cram
  HG00126: /data/samples/HG00126/reads/HG00126.cram
sequential: true
threads: 4
mem_mb_mode: scaled
engine: rust