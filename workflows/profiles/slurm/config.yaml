# Generic Snakemake 8 SLURM profile. The executor plugin submits with sbatch
# and queries job status itself.
# Site profiles: workflows/profiles/slurm-grace and workflows/profiles/slurm-faster.
# Set slurm_account and slurm_partition there. Do not use a partition named
# normal (Grace has none). The controller runs on the host: the SIF has no sbatch.
# runtime is minutes (int).

executor: slurm
restart-times: 2
latency-wait: 120
jobs: 100
printshellcmds: true

default-resources:
  runtime: 60
  mem_mb: 4000

set-threads:
  call: 4
  label: 2
