name: ci

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml,dashboard]"
          ruff check python tests
          pytest -m "not io and not label and not slow"

  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Linux image
        run: docker build -t arcsv2:dev .
      - name: All tests inside the container
        run: docker run --rm -e PYTHONPATH=/work/python --entrypoint pytest -v "${{ github.workspace }}:/work" -w /work arcsv2:dev -q
      - name: Label workflow dry run
        run: |
          mkdir -p tests/fixtures/label-smoke haps
          printf '>chrSim\nACGTACGT\n' > tests/fixtures/label-smoke/ref.fa
          cp tests/fixtures/label-smoke/ref.fa haps/sim.hap1.fa
          cp tests/fixtures/label-smoke/ref.fa haps/sim.hap2.fa
          : > tests/fixtures/label-smoke/gaps.bed
          : > tests/fixtures/label-smoke/unreliable.bed
          : > tests/fixtures/label-smoke/sim.cram
          docker run --rm -e PYTHONPATH=/work/python --entrypoint snakemake -v "${{ github.workspace }}:/work" -w /work arcsv2:dev \
            -s workflows/label.smk -n --configfile workflows/config/label.smoke.yaml
      - name: Simulated label workflow
        run: |
          docker run --rm -e PYTHONPATH=/work/python --entrypoint bash -v "${{ github.workspace }}:/work" -w /work arcsv2:dev -lc '
            export PATH="/opt/conda/bin:$PATH"
            python scripts/simulate_haplotypes.py --out pilot --length 200000 --events 5 --coverage 20 --seed 7
            mkdir -p haps
            cp pilot/hap1.fa haps/sim.hap1.fa
            cp pilot/hap2.fa haps/sim.hap2.fa
            : > pilot/gaps.bed
            : > pilot/unreliable.bed
            cat > /tmp/label.pilot.yaml <<EOF
            data_root: .
            reference: pilot/ref.fa
            gaps: pilot/gaps.bed
            unreliable: pilot/unreliable.bed
            chroms: [chrSim]
            samples: [sim]
            cram: {sim: pilot/reads.bam}
            sequential: false
            EOF
            snakemake -s workflows/label.smk -j 2 --configfile /tmp/label.pilot.yaml
            python scripts/check_label_pilot.py
          '

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust tests and clippy
        run: |
          cargo test --manifest-path core/arcsv-core/Cargo.toml
          cargo clippy --manifest-path core/arcsv-core/Cargo.toml -- -D warnings
