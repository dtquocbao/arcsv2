# Linux container environment. pysam, mappy, samtools, and minimap2 have no
# native Windows builds; see docs/CROSS_PLATFORM.md.
# From this repo, after creating the env: pip install -e ".[dev]"
# Lock when conda-lock is available:
#   conda-lock lock -f environment.yml -p linux-64 -p linux-aarch64 -p osx-arm64 -p osx-64 -o conda-lock.yml
name: arcsv2
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy
  - scikit-learn
  - xgboost
  - lightgbm
  - pysam>=0.22
  - mappy>=2.28
  - minimap2>=2.28
  - samtools>=1.20
  - snakemake-minimal>=8
  - streamlit>=1.46
  - pandas>=2
  - altair>=5
  - rust
  - maturin>=1.7
  - compilers
  - binutils
  - pkg-config
  - openssl
  - clangdev
  - libclang
  - patchelf
  - pip
