[package]
name = "arcsv2-native"
version = "0.1.0"
edition = "2021"
description = "Optional PyO3 kernels for ARC-SV2 (BAM load, graph). Bit-identical to Python."
license = "MIT"

[lib]
name = "arcsv2_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rust-htslib = "0.49"
sha2 = "0.10"
indexmap = "2"
rayon = "1.10"
