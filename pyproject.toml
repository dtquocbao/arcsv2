[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcsv2"
version = "0.1.0"
description = "Clean-room reimplementation of ARC-SV (Zhou, Arthur, Guo et al., Cell 2024) and its ML filter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "typer>=0.12",
    "pydantic>=2",
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "xgboost>=2",
    "lightgbm>=4",
    "skops>=0.9",
]
label = ["mappy>=2.28"]
io = ["pysam>=0.22"]
dashboard = ["streamlit>=1.46", "pandas>=2", "altair>=5", "pyarrow>=16"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
arcsv2 = "arcsv2.cli:app"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"arcsv2.dashboard" = [
    "demo/*/*.tab",
    "demo/*/*.tsv",
    "demo/*/*.json",
    "demo/example_bam/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python", "."]
markers = [
    "slow: tests that simulate reads or fit models",
    "io: needs pysam (Linux container; no native Windows build)",
    "label: needs mappy (Linux container; no native Windows build)",
    "network: optional live HTTPS HEAD against public buckets (ARCSV2_NETWORK=1)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["python", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
